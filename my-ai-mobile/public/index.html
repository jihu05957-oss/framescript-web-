<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111827">
<title>My AI · 인터넷 검색 AI</title>
<style>
:root{color-scheme:dark;--bg:#0c1019;--panel:#151a25;--panel2:#1e2532;--border:#313847;--text:#f4f5f8;--sub:#a4aebe;--accent:#7b8eff;--user:#273c62}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:flex;height:100%;min-height:0}.side{width:265px;background:#121722;display:flex;flex-direction:column;border-right:1px solid var(--border);padding:18px 12px;flex-shrink:0;z-index:20}.brand{display:flex;align-items:center;gap:12px;margin:0 8px 22px;font-weight:800;font-size:20px}.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:13px;background:linear-gradient(140deg,#586cf3,#ba79fb);color:white}.ghost,.item,.icon{background:transparent;border:0}.ghost{border:1px solid var(--border);padding:12px;border-radius:12px;text-align:left}.ghost:hover,.item:hover,.icon:hover{background:var(--panel2)}.side-title{font-size:12px;color:var(--sub);margin:21px 12px 9px;font-weight:600}.list{flex:1;min-height:0;overflow-y:auto}.history-row{display:flex;align-items:center;gap:2px;border-radius:11px}.history-row.selected{background:#242e41}.item{min-width:0;flex:1;text-align:left;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;padding:12px 8px;border-radius:10px;font-size:13px}.remove{border:0;background:none;color:var(--sub);padding:10px}.side-bottom{border-top:1px solid var(--border);padding-top:10px;display:grid;gap:4px}.side-bottom button{padding:10px 8px;text-align:left;color:var(--sub);border:0;background:none;border-radius:8px}.side-bottom button:hover{background:var(--panel2)}
.main{display:flex;flex:1;flex-direction:column;min-width:0;min-height:0}.top{height:66px;flex-shrink:0;border-bottom:1px solid #222b38;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 22px}.top-inner{display:flex;align-items:center;gap:12px;min-width:0}.top h1{font-size:17px;line-height:1.2;margin:0}.top small{display:block;color:var(--sub);font-size:11px;margin-top:4px}.online{color:#79d6a2;border:1px solid #255f4a;background:#14291f;font-size:12px;border-radius:999px;padding:7px 10px;white-space:nowrap}.online.off{color:#ffcb88;border-color:#8c633d;background:#2b2119}.icon{padding:9px;border-radius:9px;font-size:21px}.mobile-menu{display:none}
.scroll{min-height:0;flex:1;overflow-y:auto;overscroll-behavior:contain}.thread{max-width:810px;margin:auto;padding:25px 22px 40px}.welcome{margin:10vh auto 0;max-width:560px;text-align:center}.welcome-mark{font-size:42px;display:inline-grid;place-items:center;background:linear-gradient(140deg,#6478e8,#a77efa);width:78px;height:78px;border-radius:25px;margin-bottom:18px}.welcome h2{font-size:27px;margin:8px 0}.welcome p{color:var(--sub);line-height:1.8}.suggest{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:26px}.suggest button{background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:11px 14px;font-size:13px}
.message{display:flex;gap:14px;margin:0 0 27px;align-items:flex-start}.message.user{justify-content:flex-end}.ai-icon{display:grid;place-items:center;flex:0 0 28px;height:28px;border-radius:9px;background:#39467a;font-size:13px}.msg-body{max-width:calc(100% - 42px);min-width:0}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.76;font-size:15px}.user .bubble{padding:12px 16px;border-radius:17px 17px 5px 17px;background:var(--user)}.sources{margin-top:14px;border:1px solid var(--border);border-radius:14px;background:var(--panel);padding:12px}.sources strong{font-size:12px;color:#aabdff}.sources a{display:block;margin-top:11px;color:#ccd6ff;font-size:12px;text-decoration:none;overflow-wrap:anywhere;line-height:1.5}.sources a:hover{text-decoration:underline}.msg-tools{margin-top:10px}.msg-tools button{background:none;border:0;padding:3px 0;color:var(--sub);font-size:12px}.notice{font-size:12px;color:#9fdbb5;margin:10px 0}
.footer{width:100%;padding:10px 20px max(12px,env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--bg) 88%,transparent);flex-shrink:0}.footer-inner{max-width:810px;margin:auto}.progress{font-size:12px;color:var(--sub);padding:0 8px 9px;min-height:21px}.composer{background:var(--panel);border:1px solid #3b4455;border-radius:18px;padding:14px;box-shadow:0 8px 32px #0002}.composer textarea{display:block;width:100%;background:none;border:0;outline:0;resize:none;max-height:140px;min-height:24px;line-height:1.5;font-size:15px}.composer-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:12px}.model{border:0;border-radius:8px;padding:8px;color:#c8d1ff;background:#222b41;font-size:12px;max-width:70%}.send{background:#f4f5f8;color:#151821;border:0;width:36px;height:36px;border-radius:12px;font-size:23px;font-weight:800}.fineprint{font-size:11px;color:#8491a4;line-height:1.4;text-align:center;margin:10px 0 0}
.scrim{display:none;position:fixed;inset:0;background:#0009;z-index:15}.scrim.open{display:block}.login-cover{position:fixed;inset:0;z-index:80;background:#0c1019;display:grid;place-items:center;padding:24px}.login-cover[hidden]{display:none}.login-card{background:var(--panel);border:1px solid var(--border);padding:30px 24px;border-radius:23px;width:min(100%,390px);text-align:center}.login-card h2{font-size:23px;margin:12px 0}.login-card p{color:var(--sub);font-size:13px;line-height:1.6}.login-card input{width:100%;padding:15px;background:var(--bg);border:1px solid var(--border);border-radius:12px;margin:18px 0 10px}.primary{background:var(--accent);color:white;border:0;border-radius:12px;width:100%;padding:14px;font-weight:700}.error{color:#ff9b9b;font-size:12px;margin-top:10px;min-height:18px}.setup-banner{font-size:13px;text-align:center;background:#3a2d16;color:#ffe6ab;padding:12px}.setup-banner[hidden]{display:none}
@media(max-width:720px){.side{position:fixed;inset:0 auto 0 0;transform:translateX(-105%);transition:transform .2s;width:min(86vw,310px);box-shadow:0 10px 35px #0008}.side.open{transform:translateX(0)}.mobile-menu{display:block}.top{height:59px;padding:0 12px}.top h1{font-size:15px}.top small{font-size:10px}.online{font-size:10px;padding:6px 8px}.thread{padding:16px 14px 20px}.welcome{margin-top:8vh}.welcome h2{font-size:23px}.welcome p{font-size:13px}.message{gap:9px;margin-bottom:23px}.bubble{font-size:14px}.msg-body{max-width:calc(100% - 36px)}.footer{padding:7px 9px max(9px,env(safe-area-inset-bottom))}.composer{border-radius:18px;padding:12px}.fineprint{font-size:10px}.suggest button{font-size:12px;padding:9px}}
</style></head><body>
<div id="app">
<aside class="side" id="side"><div class="brand"><span class="brand-mark">✦</span> My AI</div><button class="ghost" id="new">＋ 새 대화</button><div class="side-title">내 대화 목록</div><nav class="list" id="list"></nav><div class="side-bottom"><button id="export">↧ 대화 기록 내보내기</button><button id="logout">⇥ 잠금</button></div></aside>
<div class="scrim" id="scrim"></div>
<main class="main"><header class="top"><div class="top-inner"><button class="icon mobile-menu" id="menu" aria-label="메뉴 열기">☰</button><div><h1>My AI</h1><small>매 질문 인터넷 검색 · 출처 검증</small></div></div><span class="online" id="status">● 연결 확인 중</span></header><div class="setup-banner" hidden id="setup">무료 Gemini 연결 대기 중 · Google AI Studio에서 무료 API 키를 만들고 Render에 GEMINI_API_KEY를 등록하세요.</div>
<section class="scroll" id="scroll"><div class="thread" id="thread"></div></section>
<footer class="footer"><div class="footer-inner"><div class="progress" id="progress">⌕ 모든 질문에 인터넷 검색 자동 실행</div><form id="form" class="composer"><textarea id="prompt" rows="1" placeholder="무엇이든 질문해 주세요..." maxlength="12000" aria-label="질문 입력"></textarea><div class="composer-bottom"><select id="model" class="model" aria-label="AI 모델"><option value="gemini-2.5-flash">✦ Gemini Flash · 무료</option><option value="gemini-2.5-flash-lite">✦ Gemini Flash-Lite · 무료</option></select><button class="send" type="submit" id="send" aria-label="전송">↑</button></div></form><p class="fineprint">Gemini 무료 등급 기준 · 사용량 제한 있음 · Google 검색이 실행된 답변만 표시 · 중요 정보는 원문 확인</p></div></footer>
</main></div>
<div class="login-cover" id="login"><div class="login-card"><div class="brand-mark" style="margin:auto;width:53px;height:53px;font-size:28px">✦</div><h2>My AI 잠금 해제</h2><p>비밀번호를 입력하면 개인 AI에 접속할 수 있습니다.</p><form id="loginform"><input id="password" type="password" placeholder="개인 비밀번호" autocomplete="current-password" required><button class="primary" type="submit">접속하기</button><div class="error" id="loginerror" role="alert"></div></form></div></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const KEY='my_ai_mobile_research_v1';
const fresh=()=>({active:null,chats:[],model:'gemini-2.5-flash'});
let state=fresh();try{const old=JSON.parse(localStorage.getItem(KEY));if(old&&Array.isArray(old.chats))state=Object.assign(fresh(),old);}catch{}
let busy=false;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch{}};
const active=()=>state.chats.find(c=>c.id===state.active);
function closeMenu(){$('side').classList.remove('open');$('scrim').classList.remove('open');}
function openMenu(){$('side').classList.add('open');$('scrim').classList.add('open');}
function newChat(){if(busy)return;const c={id:crypto.randomUUID(),title:'새 대화',messages:[]};state.chats.unshift(c);state.chats=state.chats.slice(0,60);state.active=c.id;save();render();closeMenu();$('prompt').focus();}
function getChat(){if(!active())newChat();return active();}
function renderList(){const list=$('list');list.replaceChildren();for(const c of state.chats){const row=document.createElement('div');row.className='history-row'+(c.id===state.active?' selected':'');const btn=document.createElement('button');btn.className='item';btn.textContent=c.title||'새 대화';btn.onclick=()=>{if(busy)return;state.active=c.id;save();render();closeMenu();};const del=document.createElement('button');del.className='remove';del.textContent='×';del.setAttribute('aria-label','대화 삭제');del.onclick=()=>{if(busy)return;if(!confirm('대화를 삭제하시겠습니까?'))return;state.chats=state.chats.filter(x=>x.id!==c.id);if(state.active===c.id)state.active=state.chats[0]?.id||null;save();render();};row.append(btn,del);list.append(row);}}
function validURL(url){try{const u=new URL(url);return ['https:','http:'].includes(u.protocol)?u.href:null;}catch{return null;}}
function renderMessage(m){const article=document.createElement('article');article.className='message '+m.role;if(m.role==='assistant'){const icon=document.createElement('span');icon.className='ai-icon';icon.textContent='✦';article.append(icon);}const body=document.createElement('div');body.className='msg-body';const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=m.content||'검색 중입니다…';body.append(bubble);
if(m.role==='assistant' && m.searched){const note=document.createElement('div');note.className='notice';note.textContent='✓ 인터넷 검색 실행 · 확인한 출처 '+(m.sources||[]).length+'개';body.append(note);const sources=(m.sources||[]).filter(s=>validURL(s.url));if(sources.length){const box=document.createElement('div');box.className='sources';const title=document.createElement('strong');title.textContent='🔗 인터넷 출처 ('+sources.length+')';box.append(title);sources.forEach((s,i)=>{const a=document.createElement('a');a.href=validURL(s.url);a.target='_blank';a.rel='noopener noreferrer';a.textContent=(i+1)+'. '+(s.title||new URL(s.url).hostname);box.append(a);});body.append(box);}}
if(m.role==='assistant'&&m.content){const tools=document.createElement('div');tools.className='msg-tools';const copy=document.createElement('button');copy.textContent='답변 복사';copy.onclick=()=>navigator.clipboard.writeText(m.content).then(()=>copy.textContent='복사됨').catch(()=>{});tools.append(copy);body.append(tools);}article.append(body);return article;}
function render(){renderList();const t=$('thread');t.replaceChildren();const c=active();if(!c||!c.messages.length){const w=document.createElement('div');w.className='welcome';w.innerHTML='<span class="welcome-mark">⌕</span><h2>어떤 정보가 궁금하세요?</h2><p>질문할 때마다 웹 검색을 수행하고<br>국내외 공개 자료를 확인해 답변합니다.</p><div class="suggest"><button type="button">오늘 최신 뉴스</button><button type="button">자료 비교·분석</button><button type="button">최신 기술 동향</button></div>';const samples=['오늘 주요 뉴스의 최신 정보를 출처와 함께 정리해줘','한국과 해외 공식 자료를 비교해서 자세하게 설명해줘','최근 인공지능 기술 동향을 출처와 함께 분석해줘'];w.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{$('prompt').value=samples[i];$('prompt').focus();resize();});t.append(w);}else c.messages.forEach(m=>t.append(renderMessage(m)));scrollDown();}
function scrollDown(){$('scroll').scrollTop=$('scroll').scrollHeight;}
function resize(){const el=$('prompt');el.style.height='auto';el.style.height=Math.min(el.scrollHeight,140)+'px';}
function setBusy(v){busy=v;$('send').disabled=v;$('prompt').disabled=v;$('model').disabled=v;$('send').textContent=v?'…':'↑';}
async function status(){try{const r=await fetch('/api/status',{cache:'no-store'});const s=await r.json();$('status').textContent=s.configured?'● 웹 검색 준비':'● 무료 API 연결 필요';$('status').classList.toggle('off',!s.configured);$('setup').hidden=s.configured;$('login').hidden=s.authenticated;if(!s.loginEnabled)$('loginerror').textContent='서버 비밀번호 설정이 필요합니다.';}catch{$('status').textContent='● 서버 연결 실패';}}
async function sendMessage(){const prompt=$('prompt').value.trim();if(!prompt||busy)return;if(!$('login').hidden){$('loginerror').textContent='로그인 후 질문할 수 있습니다.';return;}const c=getChat();c.messages.push({role:'user',content:prompt});if(c.title==='새 대화')c.title=prompt.slice(0,40);$('prompt').value='';resize();state.model=$('model').value;save();render();setBusy(true);$('progress').textContent='⌕ 인터넷 검색 및 출처 비교 중입니다…';
try{const messages=c.messages.slice(-35).map(m=>({role:m.role,content:m.content}));const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages,model:state.model}),credentials:'same-origin'});const data=await r.json();if(!r.ok)throw Error(data.error||'AI 서버 오류');if(!data.searched)throw Error('웹 검색이 확인되지 않았습니다.');c.messages.push({role:'assistant',content:data.answer,sources:data.sources,searched:true});}
catch(e){c.messages.push({role:'assistant',content:'오류: '+e.message,searched:false});}
finally{setBusy(false);$('progress').textContent='⌕ 모든 질문에 인터넷 검색 자동 실행';save();render();$('prompt').focus();}}
$('form').onsubmit=e=>{e.preventDefault();sendMessage();};$('prompt').addEventListener('input',resize);$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMessage();}});
$('new').onclick=newChat;$('menu').onclick=openMenu;$('scrim').onclick=closeMenu;
$('model').value=['gemini-2.5-flash','gemini-2.5-flash-lite','gemini-2.5-flash'].includes(state.model)?state.model:'gemini-2.5-flash';$('model').onchange=()=>{state.model=$('model').value;save();};
$('loginform').onsubmit=async e=>{e.preventDefault();$('loginerror').textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});const j=await r.json();if(!r.ok)throw Error(j.error||'로그인 실패');$('login').hidden=true;$('password').value='';$('prompt').focus();}catch(e){ $('loginerror').textContent=e.message;}};
$('logout').onclick=async()=>{closeMenu();await fetch('/api/logout',{method:'POST'}).catch(()=>{});$('login').hidden=false;};
$('export').onclick=()=>{const json=JSON.stringify({date:new Date().toISOString(),chats:state.chats},null,2);const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='my-ai-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);};
status();render();
})();
</script></body></html>
